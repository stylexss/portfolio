<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Profile avatar placeholder">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)"/>
  
  <!-- Hair -->
  <path d="M 200 80 
           C 150 80, 120 110, 120 160
           C 120 180, 125 195, 130 205
           C 125 200, 120 190, 118 180
           C 115 165, 112 145, 115 125
           C 120 95, 145 75, 200 75
           C 255 75, 280 95, 285 125
           C 288 145, 285 165, 282 180
           C 280 190, 275 200, 270 205
           C 275 195, 280 180, 280 160
           C 280 110, 250 80, 200 80 Z" 
        fill="url(#hairGradient)"/>
  
  <!-- Head -->
  <circle cx="200" cy="170" r="55" fill="#fcd7b6"/>
  
  <!-- Ears -->
  <circle cx="150" cy="170" r="10" fill="#fcd7b6"/>
  <circle cx="250" cy="170" r="10" fill="#fcd7b6"/>
  <circle cx="150" cy="170" r="5" fill="#f8b4b4" opacity="0.6"/>
  <circle cx="250" cy="170" r="5" fill="#f8b4b4" opacity="0.6"/>
  
  <!-- Eyes -->
  <circle cx="185" cy="165" r="6" fill="#1e3a8a"/>
  <circle cx="215" cy="165" r="6" fill="#1e3a8a"/>
  <circle cx="185" cy="165" r="2" fill="#ffffff"/>
  <circle cx="215" cy="165" r="2" fill="#ffffff"/>
  
  <!-- Eyebrows -->
  <path d="M 175 155 Q 185 150 195 155" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 205 155 Q 215 150 225 155" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Nose -->
  <path d="M 200 175 Q 195 185 200 190" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Mouth -->
  <path d="M 185 200 Q 200 210 215 200" stroke="#dc2626" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Glasses (optional, for tech vibe) -->
  <circle cx="185" cy="165" r="12" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="215" cy="165" r="12" fill="none" stroke="#1e293b" stroke-width="2"/>
  <line x1="197" y1="165" x2="203" y2="165" stroke="#1e293b" stroke-width="2"/>
  <line x1="173" y1="165" x2="163" y2="162" stroke="#1e293b" stroke-width="2"/>
  <line x1="227" y1="165" x2="237" y2="162" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Body/Shirt -->
  <path d="M 160 220 
           C 140 280, 150 320, 200 330
           C 250 320, 260 280, 240 220
           L 240 250 C 240 290, 230 340, 200 350
           C 170 340, 160 290, 160 250 Z" 
        fill="#4f46e5"/>
  
  <!-- Shoulders -->
  <ellipse cx="200" cy="230" rx="60" ry="25" fill="#4f46e5"/>
  
  <!-- Collar -->
  <path d="M 175 225 L 200 235 L 225 225" stroke="#4338ca" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Neck -->
  <rect x="185" y="215" width="30" height="20" rx="10" fill="#fcd7b6"/>
</svg>