<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Project preview placeholder">
  <defs>
    <linearGradient id="projectBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f9fafb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#projectBg)"/>
  
  <!-- Browser Window -->
  <g>
    <!-- Browser Header -->
    <rect x="30" y="40" width="540" height="320" rx="8" fill="url(#cardGradient)" stroke="#d1d5db" stroke-width="2"/>
    
    <!-- Browser Controls -->
    <circle cx="55" cy="60" r="6" fill="#ef4444"/>
    <circle cx="75" cy="60" r="6" fill="#f59e0b"/>
    <circle cx="95" cy="60" r="6" fill="#10b981"/>
    
    <!-- Browser Address Bar -->
    <rect x="120" y="53" width="420" height="14" rx="7" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
    <text x="330" y="62" font-family="Inter, Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">https://example-project.netlify.app</text>
    
    <!-- Content Area -->
    <!-- Sidebar/Nav -->
    <rect x="50" y="85" width="100" height="255" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="60" y="95" width="80" height="8" rx="4" fill="#4f46e5" opacity="0.7"/>
    <rect x="60" y="110" width="80" height="6" rx="3" fill="#d1d5db"/>
    <rect x="60" y="125" width="80" height="6" rx="3" fill="#d1d5db"/>
    <rect x="60" y="140" width="80" height="6" rx="3" fill="#d1d5db"/>
    <rect x="60" y="155" width="80" height="6" rx="3" fill="#d1d5db"/>
    
    <!-- Main Content -->
    <!-- Hero Section -->
    <rect x="170" y="95" width="380" height="60" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
    <rect x="185" y="110" width="120" height="10" rx="5" fill="#4f46e5" opacity="0.8"/>
    <rect x="185" y="130" width="200" height="6" rx="3" fill="#a5b4fc"/>
    
    <!-- Cards -->
    <rect x="170" y="175" width="115" height="70" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="185" y="190" width="85" height="8" rx="4" fill="#374151" opacity="0.6"/>
    <rect x="185" y="210" width="95" height="6" rx="3" fill="#d1d5db"/>
    <rect x="185" y="225" width="75" height="6" rx="3" fill="#d1d5db"/>
    
    <rect x="300" y="175" width="115" height="70" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="315" y="190" width="85" height="8" rx="4" fill="#374151" opacity="0.6"/>
    <rect x="315" y="210" width="95" height="6" rx="3" fill="#d1d5db"/>
    <rect x="315" y="225" width="75" height="6" rx="3" fill="#d1d5db"/>
    
    <rect x="430" y="175" width="115" height="70" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="445" y="190" width="85" height="8" rx="4" fill="#374151" opacity="0.6"/>
    <rect x="445" y="210" width="95" height="6" rx="3" fill="#d1d5db"/>
    <rect x="445" y="225" width="75" height="6" rx="3" fill="#d1d5db"/>
    
    <!-- Bottom Section -->
    <rect x="170" y="265" width="185" height="50" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="185" y="280" width="70" height="8" rx="4" fill="#374151" opacity="0.6"/>
    <rect x="185" y="295" width="130" height="6" rx="3" fill="#d1d5db"/>
    
    <rect x="370" y="265" width="175" height="50" rx="4" fill="#4f46e5" opacity="0.1" stroke="#4f46e5" stroke-width="1"/>
    <rect x="385" y="280" width="70" height="8" rx="4" fill="#4f46e5" opacity="0.8"/>
    <rect x="385" y="295" width="120" height="6" rx="3" fill="#4f46e5" opacity="0.4"/>
  </g>
  
  <!-- Project Title Overlay -->
  <g opacity="0.8">
    <rect x="200" y="15" width="200" height="20" rx="10" fill="#1f2937"/>
    <text x="300" y="27" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">PROJECT PREVIEW</text>
  </g>
</svg>